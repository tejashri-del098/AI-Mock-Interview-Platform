name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push to Hugging Face
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Create an orphan branch (no history) to avoid pushing binary files in past commits
          git checkout --orphan deploy-branch
          
          # Remove binary assets that HF rejects
          git rm -rf --cached assets/ || true
          rm -rf assets/
          
          # Commit the clean tree as a single root commit
          git add -A
          git commit -m "deploy: clean single-commit push to Hugging Face Spaces"
          
          # Push to Hugging Face Space
          git remote add hf https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME
          git push --force hf deploy-branch:main
